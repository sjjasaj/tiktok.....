
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TikTokGiftController main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TikTokGiftController-Windows
          path: dist/TikTokGiftController.exe
