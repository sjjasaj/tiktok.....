name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python en la nube
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Crear EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TikTokGiftController main.py

      - name: Guardar EXE
        uses: actions/upload-artifact@v4
        with:
          name: TikTokGiftController-Windows
          path: dist/TikTokGiftController.exe
